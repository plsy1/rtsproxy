name: Build OpenWrt Packages

on:
  release:
    types:
      - published
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: OpenWRT ${{ matrix.sdk }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - aarch64_cortex-a76
          - aarch64_generic
          - arm_cortex-a5_vfpv4
          - arm_cortex-a7
          - arm_cortex-a7_neon-vfpv4
          - arm_cortex-a7_vfpv4
          - arm_cortex-a9
          - arm_cortex-a9_neon
          - arm_cortex-a9_vfpv3-d16
          - arm_cortex-a15_neon-vfpv4
          - mips_24kc
          - mips_mips32
          - mipsel_24kc
          - mipsel_24kc_24kf
          - mipsel_74kc
          - mipsel_mips32

        sdk:
          - "24.10.4" # For IPK
          - "25.12.0" # For APK
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Prepare feed and sources
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
          else
            TAG_NAME="${{ github.ref_name }}"
          fi
          VERSION_FULL="${TAG_NAME#v}"
          
          # Update package version in Makefiles
          sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=$VERSION_FULL/" openwrt/rtsproxy/Makefile
          sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=$VERSION_FULL/" openwrt/luci-app-rtsproxy/Makefile
          
          # Copy source files to the rtsproxy package folder
          cp -r src openwrt/rtsproxy/
          cp -r include openwrt/rtsproxy/
          cp -r webui openwrt/rtsproxy/
          cp meson.build openwrt/rtsproxy/
          cp meson_options.txt openwrt/rtsproxy/
          
          # Fix CRLF line endings
          find openwrt -type f -exec sed -i 's/\r$//' {} +

      - name: Build
        uses: openwrt/gh-action-sdk@v9
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.sdk }}
          FEED_DIR: ${{ github.workspace }}/openwrt
          NO_SHFMT_CHECK: true
          PACKAGES: ${{ matrix.arch == 'x86_64' && 'luci-app-rtsproxy rtsproxy' || 'rtsproxy' }}
          V: sc

      - name: Collect artifacts
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
          else
            TAG_NAME="${{ github.ref_name }}"
          fi
          VERSION_FULL="${TAG_NAME#v}"
          mkdir -p output
          
          # Collect IPK packages
          find bin/packages/ -name "rtsproxy*.ipk" ! -name "*-dbgsym*" | while read -r file; do
            if [[ "$file" == *"luci-app-rtsproxy"* ]]; then
              cp "$file" "output/luci-app-rtsproxy_${VERSION_FULL}_all.ipk"
            else
              cp "$file" "output/rtsproxy_${VERSION_FULL}_openwrt-${{ matrix.sdk }}-${{ matrix.arch }}.ipk"
            fi
          done

          # Collect APK packages
          find bin/packages/ -name "rtsproxy*.apk" ! -name "*-dbgsym*" | while read -r file; do
            if [[ "$file" == *"luci-app-rtsproxy"* ]]; then
              cp "$file" "output/luci-app-rtsproxy_${VERSION_FULL}_all.apk"
            else
              cp "$file" "output/rtsproxy_${VERSION_FULL}_openwrt-${{ matrix.sdk }}-${{ matrix.arch }}.apk"
            fi
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rtsproxy-package-${{ matrix.sdk }}-${{ matrix.arch }}
          path: |
            output/*.ipk
            output/*.apk

  release:
    name: Release IPKs and APKs
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_packages
          pattern: "rtsproxy-package-*"
          merge-multiple: true
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
          else
            TAG_NAME="${{ github.ref_name }}"
          fi
          shopt -s nullglob
          FILES=(release_packages/*.ipk release_packages/*.apk)
          if [ ${#FILES[@]} -gt 0 ]; then
            gh release upload "$TAG_NAME" "${FILES[@]}" --clobber
          else
            echo "No package files found to upload"
          fi
