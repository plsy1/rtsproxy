name: Build LuCI Package

on:
  release:
    types:
      - published
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: OpenWRT LuCI Build ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk:
          - "24.10.4" # For IPK
          - "25.12.0" # For APK
        arch:
          - x86_64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Prepare feed and sources
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
          else
            TAG_NAME="${{ github.ref_name }}"
          fi
          VERSION_FULL="${TAG_NAME#v}"
          
          # Extract version and release
          if [[ "$VERSION_FULL" =~ ^[0-9]+\.[0-9]+\.[0-9]+-r[0-9]+$ ]]; then
            PKG_VER="${VERSION_FULL%-r*}"
            PKG_REL="${VERSION_FULL##*-r}"
          elif [[ "$VERSION_FULL" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            PKG_VER="$VERSION_FULL"
            PKG_REL=""
          else
            # Clean version string to make it valid for apk/opkg
            CLEANED=$(echo "$VERSION_FULL" | sed 's/[^0-9.]/./g' | sed -E 's/\.+/./g' | sed 's/^\.//' | sed 's/\.$//')
            if [ -z "$CLEANED" ] || [[ ! "$CLEANED" =~ ^[0-9] ]]; then
              PKG_VER="1.0.0"
            else
              PKG_VER="$CLEANED"
            fi
            PKG_REL=""
          fi
          
          # Update package version and release in Makefiles
          sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=$PKG_VER/" openwrt/rtsproxy/Makefile
          sed -i "s/^PKG_RELEASE:=.*/PKG_RELEASE:=$PKG_REL/" openwrt/rtsproxy/Makefile
          sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=$PKG_VER/" openwrt/luci-app-rtsproxy/Makefile
          sed -i "s/^PKG_RELEASE:=.*/PKG_RELEASE:=$PKG_REL/" openwrt/luci-app-rtsproxy/Makefile
          
          # Copy source files to the rtsproxy package folder
          cp -r src openwrt/rtsproxy/
          cp -r include openwrt/rtsproxy/
          cp -r webui openwrt/rtsproxy/
          cp meson.build openwrt/rtsproxy/
          cp meson_options.txt openwrt/rtsproxy/
          
          # Fix CRLF line endings
          find openwrt -type f -exec sed -i 's/\r$//' {} +

      - name: Build
        uses: openwrt/gh-action-sdk@v9
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.sdk }}
          FEED_DIR: ${{ github.workspace }}/openwrt
          NO_SHFMT_CHECK: true
          PACKAGES: luci-app-rtsproxy
          V: sc

      - name: Collect artifacts
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
          else
            TAG_NAME="${{ github.ref_name }}"
          fi
          VERSION_FULL="${TAG_NAME#v}"
          mkdir -p output
          
          # Collect IPK packages
          find bin/packages/ -name "*luci-app-rtsproxy*.ipk" ! -name "*-dbgsym*" | while read -r file; do
            cp "$file" "output/luci-app-rtsproxy_${VERSION_FULL}_all.ipk"
          done

          # Collect APK packages
          find bin/packages/ -name "*luci-app-rtsproxy*.apk" ! -name "*-dbgsym*" | while read -r file; do
            cp "$file" "output/luci-app-rtsproxy_${VERSION_FULL}_all.apk"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-package-${{ matrix.sdk }}
          path: |
            output/*.ipk
            output/*.apk

  release:
    name: Release LuCI Packages
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_packages
          pattern: "luci-app-package-*"
          merge-multiple: true
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
          else
            TAG_NAME="${{ github.ref_name }}"
          fi
          shopt -s nullglob
          FILES=(release_packages/*.ipk release_packages/*.apk)
          if [ ${#FILES[@]} -gt 0 ]; then
            gh release upload "$TAG_NAME" "${FILES[@]}" --clobber
          else
            echo "No package files found to upload"
          fi
