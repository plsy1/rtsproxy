name: Build Check

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  native-build:
    name: Native Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build g++

      - name: Setup and Build
        run: |
          meson setup builddir
          meson compile -C builddir

  cross-build-check:
    name: Cross Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm64
            cpu_family: aarch64
            cpu: aarch64
            tool: aarch64-unknown-linux-musl
          - name: arm32hf
            tool: arm-unknown-linux-musleabihf
            cpu_family: arm
            cpu: arm32hf
          - name: arm32v7hf
            tool: armv7-unknown-linux-musleabihf
            cpu_family: arm
            cpu: arm32v7hf
          - name: i686
            tool: i686-unknown-linux-musl
            cpu_family: x86_64
            cpu: i686
          - name: mips32
            tool: mips-unknown-linux-musl
            cpu_family: mips
            cpu: mips
          - name: mips32sf
            tool: mips-unknown-linux-muslsf
            cpu_family: mips
            cpu: mips32sf
          - name: mipsel
            tool: mipsel-unknown-linux-musl
            cpu_family: mips
            cpu: mips32el
          - name: mipsel-sf
            tool: mipsel-unknown-linux-muslsf
            cpu_family: mips
            cpu: mips32elsf
          - name: riscv64
            tool: riscv64-unknown-linux-musl
            cpu_family: riscv64
            cpu: riscv64
          - name: x86_64
            cpu_family: x86_64
            cpu: x86_64
            tool: x86_64-unknown-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build

      - name: Download toolchain
        run: |
          sudo mkdir -p /opt/x-tools
          wget https://github.com/cross-tools/musl-cross/releases/download/20250929/${{ matrix.tool }}.tar.xz
          sudo tar xf ${{ matrix.tool }}.tar.xz -C /opt/x-tools

      - name: Set up crossfile
        run: |
          # Determine endianness (MIPS/PPC are usually big, others little)
          ENDIAN="little"
          if [[ "${{ matrix.name }}" == mips* ]] && [[ "${{ matrix.name }}" != *el* ]]; then
            ENDIAN="big"
          fi

          echo '[host_machine]' > crossfile.ini
          echo "system = 'linux'" >> crossfile.ini
          echo "cpu_family = '${{ matrix.cpu_family }}'" >> crossfile.ini
          echo "cpu = '${{ matrix.cpu }}'" >> crossfile.ini
          echo "endian = '$ENDIAN'" >> crossfile.ini
          echo '' >> crossfile.ini
          echo '[binaries]' >> crossfile.ini
          echo "cpp = '/opt/x-tools/${{ matrix.tool }}/bin/${{ matrix.tool }}-g++'" >> crossfile.ini
          echo "ar = '/opt/x-tools/${{ matrix.tool }}/bin/${{ matrix.tool }}-ar'" >> crossfile.ini
          echo "strip = '/opt/x-tools/${{ matrix.tool }}/bin/${{ matrix.tool }}-strip'" >> crossfile.ini

      - name: Build
        run: |
          meson setup builddir --cross-file=crossfile.ini --buildtype=release -Disstatic=true
          meson compile -C builddir -j$(nproc)

  openwrt-ipk-check:
    name: OpenWrt Build Check (${{ matrix.sdk }}-${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            sdk: "24.10.4"
          - arch: mipsel_24kc
            sdk: "25.12.0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare feed and sources
        run: |
          VERSION_FULL="1.0.0-test"
          
          # Extract version and release
          if [[ "$VERSION_FULL" =~ ^[0-9]+\.[0-9]+\.[0-9]+-r[0-9]+$ ]]; then
            PKG_VER="${VERSION_FULL%-r*}"
            PKG_REL="${VERSION_FULL##*-r}"
          elif [[ "$VERSION_FULL" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            PKG_VER="$VERSION_FULL"
            PKG_REL=""
          else
            # Clean version string to make it valid for apk/opkg
            CLEANED=$(echo "$VERSION_FULL" | sed 's/[^0-9.]/./g' | sed -E 's/\.+/./g' | sed 's/^\.//' | sed 's/\.$//')
            if [ -z "$CLEANED" ] || [[ ! "$CLEANED" =~ ^[0-9] ]]; then
              PKG_VER="1.0.0"
            else
              PKG_VER="$CLEANED"
            fi
            PKG_REL=""
          fi
          
          # Update package version and release in Makefiles
          sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=$PKG_VER/" openwrt/rtsproxy/Makefile
          sed -i "s/^PKG_RELEASE:=.*/PKG_RELEASE:=$PKG_REL/" openwrt/rtsproxy/Makefile
          sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=$PKG_VER/" openwrt/luci-app-rtsproxy/Makefile
          sed -i "s/^PKG_RELEASE:=.*/PKG_RELEASE:=$PKG_REL/" openwrt/luci-app-rtsproxy/Makefile
          
          # Copy source files to the rtsproxy package folder
          cp -r src openwrt/rtsproxy/
          cp -r include openwrt/rtsproxy/
          cp -r webui openwrt/rtsproxy/
          cp meson.build openwrt/rtsproxy/
          cp meson_options.txt openwrt/rtsproxy/
          
          # Fix CRLF line endings
          find openwrt -type f -exec sed -i 's/\r$//' {} +

      - name: Cache OpenWrt dl directory
        uses: actions/cache@v4
        with:
          path: dl
          key: openwrt-dl-${{ matrix.sdk }}-${{ hashFiles('**/Makefile') }}
          restore-keys: |
            openwrt-dl-${{ matrix.sdk }}-

      - name: Build
        uses: openwrt/gh-action-sdk@v9
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.sdk }}
          FEED_DIR: ${{ github.workspace }}/openwrt
          NO_SHFMT_CHECK: true
          PACKAGES: rtsproxy luci-app-rtsproxy
          V: sc

      - name: Collect artifacts
        run: |
          VERSION_FULL="1.0.0-test"
          mkdir -p output
          
          # Collect IPK packages
          find bin/packages/ -name "*rtsproxy*.ipk" ! -name "*-dbgsym*" | while read -r file; do
            if [[ "$file" == *"luci-app-rtsproxy"* ]]; then
              cp "$file" "output/luci-app-rtsproxy_${VERSION_FULL}_all.ipk"
            else
              cp "$file" "output/rtsproxy_${VERSION_FULL}_openwrt-${{ matrix.sdk }}-${{ matrix.arch }}.ipk"
            fi
          done

          # Collect APK packages
          find bin/packages/ -name "*rtsproxy*.apk" ! -name "*-dbgsym*" | while read -r file; do
            if [[ "$file" == *"luci-app-rtsproxy"* ]]; then
              cp "$file" "output/luci-app-rtsproxy_${VERSION_FULL}_all.apk"
            else
              cp "$file" "output/rtsproxy_${VERSION_FULL}_openwrt-${{ matrix.sdk }}-${{ matrix.arch }}.apk"
            fi
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rtsproxy-test-package-${{ matrix.sdk }}-${{ matrix.arch }}
          path: |
            output/*.ipk
            output/*.apk
